# Actualiza eventos.json desde la Agenda Universitaria cada hora y lo publica con el sitio.
name: Sincronizar agenda UCB
on:
  schedule:
    - cron: "7 * * * *"      # cada hora, al minuto 7
  workflow_dispatch:          # y a mano desde la pestaña Actions
permissions:
  contents: write
jobs:
  agenda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python actualizar_agenda.py
      - name: Guardar si cambió
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add eventos.json
          git diff --cached --quiet || (git commit -m "Agenda universitaria actualizada" && git push)
